[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "factory-core"
version = "0.4.1"
description = "Founder-owned, portable software-factory core (generic; imports nothing target-specific)."
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "Jeremy McEntire", email = "jandrewmcentire@gmail.com" }]
# The ONLY third-party runtime dependency. No target pack is (or may be) listed here — the
# reverse-dependency check in scripts/check_core_purity.py enforces that.
dependencies = ["jsonschema>=4.18"]

[project.scripts]
factory = "factory_runtime.cli:main"

[project.optional-dependencies]
dev = ["build>=1.2,<2", "pytest>=7", "ruff>=0.4", "mypy>=1.8"]

[tool.setuptools.packages.find]
include = ["factory_core*", "factory_runtime*"]

[tool.setuptools.package-data]
factory_core = ["schemas/*.json"]
factory_runtime = ["schemas/*.json"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "isolation_integration: requires the macOS Seatbelt sandbox",
    "tessera_integration: requires a built real Tessera CLI",
]

[tool.mypy]
python_version = "3.12"
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["jsonschema.*"]
ignore_missing_imports = true
