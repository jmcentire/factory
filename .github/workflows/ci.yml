name: Factory gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: factory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Factory
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Check out pinned Tessera verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jmcentire/tessera
          ref: 83883e62a4aafe828092ecf7c3b20ff10342fa7e
          path: tessera

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Install Factory
        run: python -m pip install -e ".[dev]"

      - name: Run deterministic Factory gate
        run: make ship

      - name: Build pinned Tessera
        working-directory: tessera
        run: cargo build --release -p tessera

      - name: Prove real Tessera integration
        env:
          FACTORY_TESSERA_BIN: ${{ github.workspace }}/tessera/target/release/tessera
        run: python -m pytest tests/test_tessera_cli_integration.py

  isolation:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - name: Check out Factory
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Check out pinned Tessera verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jmcentire/tessera
          ref: 83883e62a4aafe828092ecf7c3b20ff10342fa7e
          path: tessera

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Install Factory
        run: python -m pip install -e ".[dev]"

      - name: Build pinned Tessera
        working-directory: tessera
        run: cargo build --release -p tessera

      - name: Prove kernel-enforced lane separation
        run: make test-isolation

      - name: Prove the signed runtime through preview
        env:
          FACTORY_TESSERA_BIN: ${{ github.workspace }}/tessera/target/release/tessera
        run: make test-tessera
