name: Factory gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: factory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Factory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check out pinned Tessera verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jmcentire/tessera
          ref: 83883e62a4aafe828092ecf7c3b20ff10342fa7e
          path: tessera

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Install Factory
        run: python -m pip install -e ".[dev]"

      - name: Run deterministic Factory gate
        run: make ship

      - name: Build and inspect published artifacts
        run: |
          python -m build --sdist --wheel --outdir "$RUNNER_TEMP/factory-dist"
          python scripts/check_distribution.py --dist-dir "$RUNNER_TEMP/factory-dist"

      - name: Smoke the installed wheel
        run: |
          python -m venv "$RUNNER_TEMP/factory-wheel-venv"
          "$RUNNER_TEMP/factory-wheel-venv/bin/python" -m pip install \
            "$RUNNER_TEMP/factory-dist"/factory_core-*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/factory-wheel-venv/bin/python" \
            "$GITHUB_WORKSPACE/scripts/smoke_installed_distribution.py"

      - name: Build and smoke from the sdist
        run: |
          python -m venv "$RUNNER_TEMP/factory-sdist-venv"
          "$RUNNER_TEMP/factory-sdist-venv/bin/python" -m pip install \
            "$RUNNER_TEMP/factory-dist"/factory_core-*.tar.gz
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/factory-sdist-venv/bin/python" \
            "$GITHUB_WORKSPACE/scripts/smoke_installed_distribution.py"

      - name: Build pinned Tessera
        working-directory: tessera
        run: cargo build --release -p tessera

      - name: Prove real Tessera integration
        env:
          FACTORY_TESSERA_BIN: ${{ github.workspace }}/tessera/target/release/tessera
        run: python -m pytest tests/test_tessera_cli_integration.py

  isolation:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - name: Check out Factory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check out pinned Tessera verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jmcentire/tessera
          ref: 83883e62a4aafe828092ecf7c3b20ff10342fa7e
          path: tessera

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Install Factory
        run: python -m pip install -e ".[dev]"

      - name: Build pinned Tessera
        working-directory: tessera
        run: cargo build --release -p tessera

      - name: Prove kernel-enforced lane separation
        run: make test-isolation

      - name: Prove the signed runtime through preview
        env:
          FACTORY_TESSERA_BIN: ${{ github.workspace }}/tessera/target/release/tessera
        run: make test-tessera
